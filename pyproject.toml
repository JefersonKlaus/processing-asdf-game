[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asdf-hero"
version = "1.0.0"
description = "ASDF Hero: press A, S, D, F when the letters reach the action bar."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flet[web]==1.0.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

# --- Flet (flet run / flet build) ------------------------------------------
[tool.flet]
product = "ASDF Hero"

[tool.flet.app]
path = "src"

# --- tests ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# The test run fails if total coverage drops below 90%
fail_under = 90
show_missing = true
skip_empty = true
