# Continuous integration: runs on every commit (push) and on every pull
# request. Two independent jobs, so a failure in one does not hide the other:
#   - lint: ruff check (style / common bugs), no tests, no Flet
#   - test: pytest (see pyproject.toml: coverage fails below 90%), on every
#     supported Python version (see [project] requires-python)
# See "Tests" in README.md.
name: CI

on:
  push:
  pull_request:

# a new push to the same branch / PR cancels the CI still running for the
# previous one (saves minutes, the old result does not matter anymore)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest supported Python (requires-python)
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
